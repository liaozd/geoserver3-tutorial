# 第 01 集教学环境（国内源版）：kartoza/geoserver 3 + PostGIS（第 06 集起增加 MongoDB）
# 与官方镜像版的区别见 episodes/ep01-install.md「国内源方案」
# 用法：docker compose -f docker-compose.cn.yml up -d
services:
  geoserver:
    # kartoza 是 Docker Hub 上的第三方成熟镜像（GeoNode 生态同款），
    # 因此可走国内 Docker Hub 加速器；官方镜像在 docker.osgeo.org，加速器不代理
    # 3.0.2 内置 Tomcat 11 + JDK 21，满足 GeoServer 3 的 JDK 17+ 要求
    image: kartoza/geoserver:3.0.2
    container_name: geoserver3-tutorial
    ports:
      - "8080:8080"
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?请先复制 .env.example 为 .env 并设置密码}
      # 注意命名带 -plugin 后缀（与官方镜像不同）；
      # 这些扩展的插件包已内置在镜像里，启动离线安装，不联网下载
      # （wps/vectortiles 属 kartoza 的 required 插件本就自带，列出来只为与官方版对齐；
      #   mongodb-plugin 在 3.0.2 镜像的 stable 清单里，已核实存在）
      STABLE_EXTENSIONS: "css-plugin,ysld-plugin,wps-plugin,vectortiles-plugin,netcdf-plugin,netcdf-out-plugin,mongodb-plugin"
      # kartoza 默认开启 CORS（DISABLE_CORS=false），教学环境无需额外设置
      # CSRF 白名单变量名与官方镜像不同：
      # CSRF_WHITELIST: "你的域名"
    volumes:
      # kartoza 的数据目录路径与官方镜像不同！
      - ./geoserver_data:/opt/geoserver/data_dir
      # 第 07 集：中文字体放宿主机 docker/fonts/（源码核实：kartoza 启动脚本 install_fonts
      # 只拷贝 /opt/fonts 下的 .ttf/.otf 进系统字体目录，.ttc 不生效；字体文件不入库）
      - ./fonts:/opt/fonts
    depends_on:
      - postgis
    restart: unless-stopped

  postgis:
    image: postgis/postgis:16-3.5
    container_name: postgis-tutorial
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: ${POSTGRES_USER:-gis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先复制 .env.example 为 .env 并设置密码}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # 第 06 集 MongoDB 对接。mongo:6 在 Docker Hub 上，国内加速器可直接拉取
  # 教学环境不启用认证（GeoServer 用 mongodb://mongo:27017/gis 直连）；
  # 生产环境必须开 auth，连接串改为 mongodb://user:pass@mongo:27017/gis
  mongo:
    image: mongo:6
    container_name: mongo-tutorial
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
    restart: unless-stopped

  # 14 集：MinIO 模拟 S3（profile: minio）
  minio:
    image: minio/minio:latest
    container_name: minio-tutorial
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请先复制 .env.example 为 .env 并设置密码}
    volumes:
      - miniodata:/data
    restart: unless-stopped

  # 15 集：ClickHouse（profile: clickhouse）
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse-tutorial
    profiles: ["clickhouse"]
    ports:
      - "127.0.0.1:8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ckdata:/var/lib/clickhouse
    restart: unless-stopped

  # 16 集：Nginx 反代（profile: prod）
  nginx:
    image: nginx:1.27
    container_name: nginx-tutorial
    profiles: ["prod"]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - geoserver
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
  miniodata:
  ckdata:
