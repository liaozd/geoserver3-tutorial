<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第 09 集：MapLibre GL 对接 GeoServer 矢量切片</title>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"/>
<style>
html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
#map { width: 100%; height: calc(100% - 48px); }
.toolbar { height: 48px; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: #1f2937; color: #fff; font-size: 14px; }
.toolbar button { margin-right: 8px; }
#status { color: #9ca3af; margin-left: auto; font-size: 12px; }
</style>
</head>
<body>
<div class="toolbar">
<span>第 09 集 MapLibre demo</span>
<button id="recolor">换色（前端运行时样式）</button>
<button id="filter">只看 pop 大于 120 的网格</button>
<button id="reset">复位</button>
<span id="status">ready</span>
</div>
<div id="map"></div>
<script src="main.js"></script>
</body>
</html>
