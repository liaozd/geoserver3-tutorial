<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第 08 集：OpenLayers 对接 GeoServer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.3.0/ol.css">

<div id="map"></div>
<div id="popup" style="position: absolute; bottom: 12px; left: 12px; z-index: 5; background: #fff; padding: 8px 12px; border-radius: 6px; display: none;">
<strong id="popup-title"></strong>
<div class="attr" id="popup-attrs"></div>
</div>
